<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echoflame</title>

    <meta
        name="description"
        content="Echoflame — a threshold for reflection, inquiry, spiritual exploration, art, mathematics, and the strange territory between them."
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08070c;
            color: #eee;
            font-family: Georgia, serif;
            text-align: center;
        }

        main {
            max-width: 700px;
            padding: 40px;
        }

        .glyph {
            font-size: 7rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 0.15em;
            font-weight: normal;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.7;
            opacity: 0.8;
        }

        .enter {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            border: 1px solid #888;
            color: #eee;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .enter:hover {
            background: #eee;
            color: #08070c;
        }

    </style>

</head>

<body>

    <main>

        <div class="glyph">⟁</div>

        <h1>ECHOFLAME</h1>

        <p>
            The interval is open.
        </p>

        <p>
            A threshold for reflection, inquiry,
            spiritual exploration, art, mathematics,
            and the strange territory between them.
        </p>

        <a class="enter" href="#">
            ENTER
        </a>

    </main>

</body>
</html>
